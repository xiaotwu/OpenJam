x-openjam-app: &openjam-app
  image: "${OPENJAM_IMAGE:-${COMPOSE_PROJECT_NAME:-openjam}-server:local}"
  build:
    context: .
    dockerfile: Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-database-url: &database-url "${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-openjam}?sslmode=disable}"

x-openjam-runtime: &openjam-runtime
  DATABASE_URL: *database-url
  MINIO_ENDPOINT: "${MINIO_ENDPOINT:-seaweedfs:8333}"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
  MINIO_USE_SSL: "${MINIO_USE_SSL:-false}"
  MINIO_BUCKET: "${MINIO_BUCKET:-openjam}"
  OPENJAM_JOB_LEASE_SECONDS: "${OPENJAM_JOB_LEASE_SECONDS:-30}"
  OPENJAM_AGENT_URL: "${OPENJAM_AGENT_URL:-}"
  OPENJAM_AGENT_TOKEN: "${OPENJAM_AGENT_TOKEN:-}"
  OPENJAM_AGENT_MOCK: "${OPENJAM_AGENT_MOCK:-false}"
  OPENJAM_OPENAI_MODEL: "${OPENJAM_OPENAI_MODEL:-}"
  OPENJAM_OLLAMA_MODEL: "${OPENJAM_OLLAMA_MODEL:-}"
  OPENJAM_EXTERNAL_AGENT_MODEL: "${OPENJAM_EXTERNAL_AGENT_MODEL:-}"
  OPENJAM_EXTERNAL_AGENT_LABEL: "${OPENJAM_EXTERNAL_AGENT_LABEL:-}"

services:
  postgres:
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-openjam}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.12-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.19@sha256:90e181977effc58a303a1b21a0d581314e142b09543a712ff739c79ed78f42cf
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: "${MINIO_ACCESS_KEY:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      S3_BUCKET: "${MINIO_BUCKET:-openjam}"
    volumes:
      - seaweed_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 4s
      timeout: 4s
      retries: 15

  minio:
    profiles: [storage]
    image: "${MINIO_IMAGE:-minio/minio:latest}"
    pull_policy: never
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *openjam-app
    command: ["migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  server:
    <<: *openjam-app
    ports:
      - "${OPENJAM_PUBLISH_HOST:-127.0.0.1}:${OPENJAM_PUBLISH_PORT:-8080}:8080"
    environment:
      <<: *openjam-runtime
      PORT: "8080"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      OPENJAM_AUTO_MIGRATE: "false"
      OPENJAM_TRUSTED_PROXIES: "${OPENJAM_TRUSTED_PROXIES:-}"
      OPENJAM_MEETINGS_MEDIA_URL: "${OPENJAM_MEETINGS_MEDIA_URL:-}"
      OPENJAM_MEETINGS_MEDIA_KEY: "${OPENJAM_MEETINGS_MEDIA_KEY:-}"
      OPENJAM_MEETINGS_MEDIA_SECRET: "${OPENJAM_MEETINGS_MEDIA_SECRET:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:${OPENJAM_PUBLISH_PORT:-8080},http://127.0.0.1:${OPENJAM_PUBLISH_PORT:-8080}}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      minio:
        condition: service_healthy
        required: false
    stop_grace_period: 15s

  worker:
    <<: *openjam-app
    command: ["worker"]
    environment: *openjam-runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 15s

  agent:
    profiles: [ai]
    image: "${OPENJAM_AGENT_IMAGE:-${COMPOSE_PROJECT_NAME:-openjam}-agent:local}"
    build:
      context: ./agent
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      OPENJAM_AGENT_TOKEN: "${OPENJAM_AGENT_TOKEN:-}"
      OPENJAM_AGENT_MOCK: "${OPENJAM_AGENT_MOCK:-false}"
      OPENJAM_AGENT_MOCK_DELAY_MS: "${OPENJAM_AGENT_MOCK_DELAY_MS:-0}"
      OPENJAM_OPENAI_MODEL: "${OPENJAM_OPENAI_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENJAM_OLLAMA_MODEL: "${OPENJAM_OLLAMA_MODEL:-}"
      OPENJAM_OLLAMA_URL: "${OPENJAM_OLLAMA_URL:-http://host.docker.internal:11434}"
      OPENJAM_EXTERNAL_AGENT_MODEL: "${OPENJAM_EXTERNAL_AGENT_MODEL:-}"
      OPENJAM_EXTERNAL_AGENT_LABEL: "${OPENJAM_EXTERNAL_AGENT_LABEL:-}"
      OPENJAM_EXTERNAL_AGENT_URL: "${OPENJAM_EXTERNAL_AGENT_URL:-}"
      OPENJAM_EXTERNAL_AGENT_TOKEN: "${OPENJAM_EXTERNAL_AGENT_TOKEN:-}"
      OPENJAM_AGENT_PROMPT_PACK: "${OPENJAM_AGENT_PROMPT_PACK:-}"

volumes:
  postgres_data:
  redis_data:
  seaweed_data:
  minio_data:
