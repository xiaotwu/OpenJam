services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  seaweedfs:
    extends:
      file: docker-compose.yml
      service: seaweedfs
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"

  minio:
    extends:
      file: docker-compose.yml
      service: minio

volumes:
  postgres_data:
  redis_data:
  seaweed_data:
  minio_data:
